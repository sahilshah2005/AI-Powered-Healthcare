{% extends 'base.html' %}

{% block content %}
<div class="container-fluid animate-fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Analytics Dashboard</h2>
        <a href="{% url 'predict' %}" class="btn btn-primary"><i class="fa-solid fa-plus me-2"></i>New Prediction</a>
    </div>

    <!-- KPIs -->
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="glass-card p-4 d-flex align-items-center">
                <div class="kpi-icon kpi-blue me-3">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">Total Warehouse Records</h6>
                    <h3 class="fw-bold mb-0">{{ total_patients }}</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="glass-card p-4 d-flex align-items-center">
                <div class="kpi-icon kpi-red me-3">
                    <i class="fa-solid fa-heart-crack"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">High Risk Patients</h6>
                    <h3 class="fw-bold mb-0">{{ high_risk_patients }}</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="glass-card p-4 d-flex align-items-center">
                <div class="kpi-icon kpi-green me-3">
                    <i class="fa-solid fa-server"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">ETL Status</h6>
                    <h3 class="fw-bold mb-0">Up-to-date</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Charts -->
    <div class="row g-4">
        <!-- Age vs Risk Chart -->
        <div class="col-md-8">
            <div class="glass-card p-4 h-100">
                <h5 class="fw-bold mb-4">Risk Distribution by Age Group</h5>
                <canvas id="ageChart" height="100"></canvas>
            </div>
        </div>
        <!-- Model Accuracy Comparison -->
        <div class="col-md-4">
            <div class="glass-card p-4 h-100">
                <h5 class="fw-bold mb-4">ML Models Accuracy</h5>
                <canvas id="accChart" height="200"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const chartData = JSON.parse('{{ chart_data|safe }}');
    
    // Age Chart
    const ctxAge = document.getElementById('ageChart').getContext('2d');
    new Chart(ctxAge, {
        type: 'bar',
        data: {
            labels: chartData.age_groups,
            datasets: [
                {
                    label: 'High Risk (Heart Disease)',
                    data: chartData.risk_by_age,
                    backgroundColor: 'rgba(239, 68, 68, 0.8)',
                    borderRadius: 4
                },
                {
                    label: 'Normal (Low Risk)',
                    data: chartData.normal_by_age,
                    backgroundColor: 'rgba(16, 185, 129, 0.8)',
                    borderRadius: 4
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: { stacked: true, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#94a3b8' } },
                x: { stacked: true, grid: { display: false }, ticks: { color: '#94a3b8' } }
            },
            plugins: {
                legend: { labels: { color: '#f8fafc' } }
            }
        }
    });

    // Accuracy Chart
    const ctxAcc = document.getElementById('accChart').getContext('2d');
    new Chart(ctxAcc, {
        type: 'polarArea',
        data: {
            labels: chartData.model_names,
            datasets: [{
                data: chartData.model_accs,
                backgroundColor: [
                    'rgba(14, 165, 233, 0.7)',
                    'rgba(16, 185, 129, 0.7)',
                    'rgba(245, 158, 11, 0.7)'
                ],
                borderWidth: 1,
                borderColor: '#1e293b'
            }]
        },
        options: {
            responsive: true,
            scales: { r: { ticks: { display: false }, grid: { color: 'rgba(255,255,255,0.1)' } } },
            plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc' } } }
        }
    });
</script>
{% endblock %}
